# Model used by `downloader separate` (read by separate.sh). Plain key=value.
# Environment variables STEM_BACKEND / STEM_MODEL / STEM_DEVICE / STEM_VENVS /
# STEM_PARAMS override these for one run without editing this file.
#
# backend  pymss            MLX engine (Apple GPU). Any model from `.venvs/pymss/bin/pymss list`
#          demucs           Meta's demucs: htdemucs, htdemucs_ft, htdemucs_6s
#          audio-separator  python-audio-separator (optional, not installed by setup.sh)
# device   pymss: mlx (recommended) or mps      demucs / audio-separator: mps or cpu
#
# Measured on a MacBook Pro M3 16 GB, 4-minute stereo song, whole run including
# model load. Quality = vocals SDR on the MVSep multisong leaderboard (higher is
# better; Logic Pro's Stem Splitter scores 11.36 there). See README for the full table.
#
#   backend=pymss   model=BS-Roformer-Resurrection.ckpt   device=mlx   80 s   11.34  <- default
#   backend=pymss   model=Kim_MelBandRoformer.ckpt        device=mlx   63 s   10.98
#   backend=demucs  model=htdemucs                        device=mps   30 s   ~8.8

backend=pymss
model=BS-Roformer-Resurrection.ckpt
device=mlx

# Where the engines live. Default: .venvs next to separate.sh (created by setup.sh).
# venvs=/path/to/.venvs

# Extra flags passed to the engine. For pymss a larger overlap_size (in samples;
# chunks are ~8 s = 352800) gives slightly cleaner stems at the cost of time, e.g.
# params="--param overlap_size=176400"
params=
